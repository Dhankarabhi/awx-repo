---
- name: Create non-sudo user on Xubuntu/Ubuntu
  hosts: all
  become: true
  vars:
    username: "testuser"        # Change if needed
    full_name: "Test User"
    shell: "/bin/bash"
    raw_password: "user"        # Simple password for testing
    password_hash: "{{ raw_password | password_hash('sha512') }}"

  tasks:

    - name: Ensure 'passwd' package is present (for user management)
      ansible.builtin.apt:
        name: passwd
        state: present
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Create the user (no sudo access)
      ansible.builtin.user:
        name: "{{ username }}"
        comment: "{{ full_name }}"
        shell: "{{ shell }}"
        create_home: yes
        groups: ""              # No extra groups
        append: no
        password: "{{ password_hash }}"
      register: user_created

    - name: Remove user from sudo group (if accidentally added)
      ansible.builtin.command:
        cmd: "gpasswd -d {{ username }} sudo"
      ignore_errors: true

    - name: Remove user from admin group (if exists)
      ansible.builtin.command:
        cmd: "gpasswd -d {{ username }} admin"
      ignore_errors: true

    - name: Ensure no sudoers file exists for the user
      ansible.builtin.file:
        path: "/etc/sudoers.d/{{ username }}"
        state: absent
      ignore_errors: true

    - name: Ensure /etc/sudoers has no entry granting sudo to this user
      ansible.builtin.shell: |
        if grep -qP '^\s*{{ username }}\s+' /etc/sudoers; then
          awk '!/^\s*{{ username }}\s+/' /etc/sudoers > /tmp/sudoers.{{ username }}
          visudo -c -f /tmp/sudoers.{{ username }} && mv /tmp/sudoers.{{ username }} /etc/sudoers
        fi
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Ensure user's home directory ownership is correct
      ansible.builtin.file:
        path: "/home/{{ username }}"
        owner: "{{ username }}"
        group: "{{ username }}"
        recurse: yes
      when: user_created is defined
