---
- name: Test VM snapshot -> stream Glance image to MinIO (no pod disk)
  hosts: localhost
  gather_facts: false

  vars:
    # CHANGE THIS (small VM pick)
    server_identifier: "72e347d4-cbd2-42a7-a897-8ef15fe0403d"

    backup_prefix: "test-snap"

    # CHANGE THIS
    minio_endpoint: "http://172.20.1.13:31228/"
    minio_bucket: "openstack-images"

    # From AWX credential env vars
    minio_access_key: "{{ lookup('env','MINIO_ACCESS_KEY') }}"
    minio_secret_key: "{{ lookup('env','MINIO_SECRET_KEY') }}"

    # Cleanup
    delete_glance_image_after_upload: true

    # RAM buffer per part (smaller = safer for k3s)
    part_size_mb: 32

  tasks:
    - name: Timestamp
      ansible.builtin.set_fact:
        backup_ts: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"

    - name: Get server info
      openstack.cloud.server_info:
        server: "{{ server_identifier }}"
      register: srv

    - name: Fail if server not found
      ansible.builtin.fail:
        msg: "Server '{{ server_identifier }}' not found."
      when: (srv.servers | length) == 0

    - name: Set facts
      ansible.builtin.set_fact:
        server_id: "{{ srv.servers[0].id }}"
        server_name: "{{ srv.servers[0].name }}"
        image_name: "{{ backup_prefix }}-{{ srv.servers[0].name | regex_replace('[^A-Za-z0-9_.-]', '-') }}-{{ backup_ts }}"
        object_key: "snapshots/{{ srv.servers[0].name }}/{{ backup_ts }}/{{ backup_prefix }}-{{ srv.servers[0].name | regex_replace('[^A-Za-z0-9_.-]', '-') }}-{{ backup_ts }}.qcow2"

    - name: Create snapshot image from server (Glance)
      openstack.cloud.server_image:
        server: "{{ server_id }}"
        name: "{{ image_name }}"
        wait: true
        timeout: 7200
      register: snap

    - name: Get image id
      ansible.builtin.set_fact:
        image_id: >-
          {{
            (snap.image.id
             if (snap.image is defined and snap.image.id is defined)
             else (snap.id if snap.id is defined else snap.image_id))
          }}

    - name: Stream Glance image -> MinIO (multipart, path-style, no disk)
      ansible.builtin.command: |
        python3 - <<'PY'
        import os
        import boto3
        from botocore.config import Config
        import openstack

        image_id = os.environ["IMAGE_ID"]
        endpoint = os.environ["MINIO_ENDPOINT"]
        bucket   = os.environ["MINIO_BUCKET"]
        ak       = os.environ["MINIO_ACCESS_KEY"]
        sk       = os.environ["MINIO_SECRET_KEY"]
        obj_key  = os.environ["OBJECT_KEY"]
        part_mb  = int(os.environ.get("PART_SIZE_MB", "32"))

        part_size = part_mb * 1024 * 1024

        # OpenStack connection uses OS_* env vars (AWX OpenStack credential)
        conn = openstack.connect()

        # MinIO client (force path-style addressing)
        s3 = boto3.client(
            "s3",
            endpoint_url=endpoint,
            aws_access_key_id=ak,
            aws_secret_access_key=sk,
            region_name="us-east-1",
            config=Config(s3={"addressing_style": "path"}),
        )

        img = conn.image.get_image(image_id)

        # Multipart upload
        mpu = s3.create_multipart_upload(Bucket=bucket, Key=obj_key)
        upload_id = mpu["UploadId"]
        parts = []
        part_number = 1
        buf = bytearray()

        try:
            stream = conn.image.download_image(img, stream=True)
            data_iter = [stream] if isinstance(stream, (bytes, bytearray)) else stream

            for chunk in data_iter:
                if not chunk:
                    continue
                buf.extend(chunk)

                while len(buf) >= part_size:
                    part = bytes(buf[:part_size])
                    del buf[:part_size]

                    resp = s3.upload_part(
                        Bucket=bucket,
                        Key=obj_key,
                        PartNumber=part_number,
                        UploadId=upload_id,
                        Body=part,
                    )
                    parts.append({"ETag": resp["ETag"], "PartNumber": part_number})
                    part_number += 1

            if buf:
                resp = s3.upload_part(
                    Bucket=bucket,
                    Key=obj_key,
                    PartNumber=part_number,
                    UploadId=upload_id,
                    Body=bytes(buf),
                )
                parts.append({"ETag": resp["ETag"], "PartNumber": part_number})

            s3.complete_multipart_upload(
                Bucket=bucket,
                Key=obj_key,
                UploadId=upload_id,
                MultipartUpload={"Parts": parts},
            )

            print(f"Uploaded: s3://{bucket}/{obj_key}")

        except Exception as e:
            # Abort multipart upload if anything fails
            try:
                s3.abort_multipart_upload(Bucket=bucket, Key=obj_key, UploadId=upload_id)
            except Exception:
                pass
            raise
        PY
      environment:
        IMAGE_ID: "{{ image_id }}"
        MINIO_ENDPOINT: "{{ minio_endpoint }}"
        MINIO_BUCKET: "{{ minio_bucket }}"
        MINIO_ACCESS_KEY: "{{ minio_access_key }}"
        MINIO_SECRET_KEY: "{{ minio_secret_key }}"
        OBJECT_KEY: "{{ object_key }}"
        PART_SIZE_MB: "{{ part_size_mb }}"

    - name: Cleanup - delete snapshot image from Glance (optional)
      openstack.cloud.image:
        state: absent
        id: "{{ image_id }}"
      when: delete_glance_image_after_upload | bool

    - name: Result
      ansible.builtin.debug:
        msg:
          - "Snapshot streaming backup test done ✅"
          - "MinIO: s3://{{ minio_bucket }}/{{ object_key }}"
          - "Glance image cleanup: {{ delete_glance_image_after_upload }}"
