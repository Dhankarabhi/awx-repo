---
- name: Precheck OpenStack + MinIO
  hosts: localhost
  gather_facts: false

  vars:
    minio_endpoint: "http://172.20.1.13:31228/"
    minio_bucket: "openstack-images"
    minio_access_key: "{{ lookup('env','MINIO_ACCESS_KEY') }}"
    minio_secret_key: "{{ lookup('env','MINIO_SECRET_KEY') }}"
    minio_region: none

  tasks:
    - name: Check OpenStack token by listing 1 server
      openstack.cloud.server_info:
      register: srv

    - name: OpenStack OK
      ansible.builtin.debug:
        msg: "OpenStack auth OK. Servers seen: {{ (srv.servers | length) }}"

    - name: Upload a tiny test object to MinIO (boto3 path-style)
      ansible.builtin.command: python3 - <<'PY'
import os
import boto3
from botocore.config import Config

endpoint = os.environ["MINIO_ENDPOINT"]
bucket   = os.environ["MINIO_BUCKET"]
ak       = os.environ["MINIO_ACCESS_KEY"]
sk       = os.environ["MINIO_SECRET_KEY"]
key      = os.environ["OBJECT_KEY"]

s3 = boto3.client(
    "s3",
    endpoint_url=endpoint,
    aws_access_key_id=ak,
    aws_secret_access_key=sk,
    region_name="us-east-1",
    config=Config(s3={"addressing_style": "path"}),
)

s3.put_object(Bucket=bucket, Key=key, Body=b"hello from awx")
print("OK uploaded:", f"s3://{bucket}/{key}")
PY
      environment:
        MINIO_ENDPOINT: "{{ minio_endpoint }}"
        MINIO_BUCKET: "{{ minio_bucket }}"
        MINIO_ACCESS_KEY: "{{ minio_access_key }}"
        MINIO_SECRET_KEY: "{{ minio_secret_key }}"
        OBJECT_KEY: "awx-tests/{{ lookup('pipe','date -u +%Y%m%dT%H%M%SZ') }}-hello.txt"
