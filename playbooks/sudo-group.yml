---
- name: Enforce auto role-based sudo control based on hostname
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    sudoers_file: /etc/sudoers.d/tlgroup

    all_sudo_groups:
      admin:
        group: adminsudo
        users: ["admin"]
      tl:
        group: tlsudo
        users: ["teamlead"]
      qa:
        group: qasudo
        users: ["qauser"]
      dev:
        group: devsudo
        users: ["dev1"]

  tasks:

    - name: Determine environment type based on hostname
      set_fact:
        env_type: >-
          {% if 'admin' in ansible_hostname %}
            admin
          {% elif 'tl' in ansible_hostname or 'teamlead' in ansible_hostname %}
            tl
          {% elif 'qa' in ansible_hostname %}
            qa
          {% elif 'dev' in ansible_hostname %}
            dev
          {% else %}
            unknown
          {% endif %}

    - name: Fail if environment type could not be determined
      fail:
        msg: "Unknown environment type for host {{ ansible_hostname }}! Hostname should include admin, tl, qa, or dev."
      when: env_type == "unknown"

    - name: Set sudo group and users for detected environment
      set_fact:
        selected_group: "{{ all_sudo_groups[env_type].group }}"
        selected_users: "{{ all_sudo_groups[env_type].users }}"

    - name: Ensure required group exists
      group:
        name: "{{ selected_group }}"
        state: present

    - name: Add users to respective group
      user:
        name: "{{ item }}"
        groups: "{{ selected_group }}"
        append: yes
      loop: "{{ selected_users }}"

    - name: Deploy sudoers configuration file
      copy:
        dest: "{{ sudoers_file }}"
        owner: root
        group: root
        mode: '0440'
        content: |
          # Admin - full control
          %adminsudo ALL=(ALL:ALL) ALL

          # TLs - limited access
          %tlsudo ALL=(ALL) NOPASSWD: \
            /usr/bin/systemctl restart *, \
            /usr/bin/systemctl stop *, \
            /usr/bin/systemctl start *, \
            /usr/bin/kill, \
            /usr/bin/htop, \
            /usr/bin/journalctl, \
            /usr/bin/netstat, \
            /usr/bin/lsof, \
            /usr/bin/du, \
            /usr/bin/git fsck, \
            /usr/bin/git gc, \
            /usr/bin/ss, \
            /usr/bin/df, \
            /usr/bin/tail, \
            /usr/bin/less, \
            /usr/bin/top, \
            /usr/bin/uptime, \
            /usr/bin/who, \
            /usr/bin/id, \
            /bin/ps, \
            /bin/cat /etc/passwd

          # QA - restart test services only
          %qasudo ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart test-*

          # Developers - no sudo access
          %devsudo ALL=(ALL) NOPASSWD: !ALL

    - name: Validate sudoers syntax
      command: visudo -cf {{ sudoers_file }}
      register: visudo_check
      changed_when: false
      failed_when: visudo_check.rc != 0

    - name: Print sudoers validation result
      debug:
        msg: "Sudoers file syntax OK for {{ ansible_hostname }}!"
      when: visudo_check.rc == 0
