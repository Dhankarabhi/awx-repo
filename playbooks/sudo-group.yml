---
- name: Enforce role-based sudo control per environment
  hosts: all
  become: yes
  vars:
    sudo_groups:
      - name: adminsudo
        users: ["admin"]
        pattern: "^admin-vm-"
      - name: tlsudo
        users: ["teamlead"]
        pattern: "^tl-vm-"
      - name: qasudo
        users: ["qauser"]
        pattern: "^qa-vm-"
      - name: devsudo
        users: ["dev1"]
        pattern: "^dev-vm-"

    sudoers_file_base: /etc/sudoers.d

  tasks:
    - name: Detect matching group based on hostname
      set_fact:
        matched_group: "{{ item }}"
      loop: "{{ sudo_groups }}"
      when: inventory_hostname is match(item.pattern)
      register: matched_result

    - name: Extract matched group
      set_fact:
        matched_group: "{{ (matched_result.results | selectattr('ansible_facts.matched_group','defined') | map(attribute='ansible_facts.matched_group') | list).0 }}"
      when: matched_result is defined

    - name: Ensure required group exists
      group:
        name: "{{ matched_group.name }}"
        state: present
      when: matched_group is defined

    - name: Add users to respective group
      user:
        name: "{{ item }}"
        groups: "{{ matched_group.name }}"
        append: yes
      loop: "{{ matched_group.users }}"
      when: matched_group is defined

    - name: Deploy sudoers configuration for matched group
      copy:
        dest: "{{ sudoers_file_base }}/{{ matched_group.name }}"
        owner: root
        group: root
        mode: '0440'
        content: |
          {% if matched_group.name == 'adminsudo' %}
          # Admin - full control
          %adminsudo ALL=(ALL:ALL) ALL

          {% elif matched_group.name == 'tlsudo' %}
          # TLs - limited access
          %tlsudo ALL=(ALL) NOPASSWD: \
            /usr/bin/systemctl restart *, \
            /usr/bin/systemctl stop *, \
            /usr/bin/systemctl start *, \
            /usr/bin/kill, \
            /usr/bin/htop, \
            /usr/bin/journalctl, \
            /usr/bin/netstat, \
            /usr/bin/lsof, \
            /usr/bin/du, \
            /usr/bin/git fsck, \
            /usr/bin/git gc, \
            /usr/bin/ss, \
            /usr/bin/df, \
            /usr/bin/tail, \
            /usr/bin/less, \
            /usr/bin/top, \
            /usr/bin/uptime, \
            /usr/bin/who, \
            /usr/bin/id, \
            /bin/ps, \
            /bin/cat /etc/passwd

          {% elif matched_group.name == 'qasudo' %}
          # QA - restart test services only
          %qasudo ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart test-*

          {% elif matched_group.name == 'devsudo' %}
          # Developers - no sudo access
          %devsudo ALL=(ALL) NOPASSWD: !ALL
          {% endif %}
      when: matched_group is defined

    - name: Validate sudoers syntax
      command: visudo -cf "{{ sudoers_file_base }}/{{ matched_group.name }}"
      register: visudo_check
      changed_when: false
      failed_when: visudo_check.rc != 0
      when: matched_group is defined

    - name: Print sudoers validation result
      debug:
        msg: "Sudoers file syntax OK for {{ matched_group.name }}!"
      when: visudo_check.rc == 0

